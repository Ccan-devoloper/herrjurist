name: fal.ai · Video-Test

# Isolierter Testpfad. Auf dem Feature-Branch laeuft er einmal beim Aendern
# dieser Workflow-Datei, damit die API-Verbindung mit dem hinterlegten Secret
# geprueft werden kann. Nach dem Test bleibt nur workflow_dispatch relevant.
on:
  push:
    branches: ["feature/fal-video-testpfad"]
    paths: [".github/workflows/fal-video-test.yml"]
  workflow_dispatch:
    inputs:
      bild:
        description: "Lokaler Bildpfad im Repo (.png/.jpg/.webp oder .b64)"
        type: string
        default: "assets/charaktere/rex-rohrbruch.jpg.b64"
      prompt:
        description: "Bewegungsanweisung fuer den 6-Sekunden-Test"
        type: string
        default: "Subtle premium editorial character animation. Preserve the exact illustrated character identity, face, body proportions, outfit, colors and line style. Natural blinking and breathing, a small cautious head turn and minimal hand movement. Very gentle camera push-in. No morphing, no new objects, no text, no logos, no style change, no camera shake."

permissions:
  contents: read

jobs:
  video-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fal.ai-Verbindung pruefen und 6-Sekunden-Clip erzeugen
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          BILD: ${{ github.event.inputs.bild || 'assets/charaktere/rex-rohrbruch.jpg.b64' }}
          PROMPT: ${{ github.event.inputs.prompt || 'Subtle premium editorial character animation. Preserve the exact illustrated character identity, face, body proportions, outfit, colors and line style. Natural blinking and breathing, a small cautious head turn and minimal hand movement. Very gentle camera push-in. No morphing, no new objects, no text, no logos, no style change, no camera shake.' }}
        run: |
          test -n "$FAL_KEY" || { echo "FAL_KEY fehlt."; exit 2; }
          test -f "$BILD" || { echo "Bild nicht gefunden: $BILD"; exit 2; }
          node bin/fal-video-test.mjs \
            --bild "$BILD" \
            --prompt "$PROMPT" \
            --dauer 6 \
            --ausgabe out/fal-video-test/test.mp4

      - name: Testergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fal-video-test-${{ github.run_id }}
          path: out/fal-video-test
          if-no-files-found: warn
          retention-days: 7
