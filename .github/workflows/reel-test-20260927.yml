name: Testreel § 224 · Microstory

on:
  push:
    branches: [codex/reel-test-20260927]
    paths:
      - 'reel-test-2026-09-27/**'
      - '.github/workflows/reel-test-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg bereitstellen
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: ElevenLabs sprechen, Maras Aufschrei und V5 rendern
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: node reel-test-2026-09-27/render-v5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-test-2026-09-27-v5
          path: |
            reel-test-2026-09-27/out-v5/herrjurist-224-test-v5.mp4
            reel-test-2026-09-27/out-v5/timing.json
            reel-test-2026-09-27/out-v5/*-elevenlabs.mp3
          if-no-files-found: warn
          retention-days: 30
