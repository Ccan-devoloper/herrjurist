name: Verify visual story approval without provider costs
on:
  push:
    branches: [fix/visuelle-story-freigabe-ohne-api-kosten]
    paths:
      - .github/workflows/prepare-story-render-fix.yml
permissions:
  contents: write
concurrency:
  group: verify-visual-story-approval
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visuelle-story-freigabe-ohne-api-kosten
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies only, without lifecycle scripts or provider credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install local renderer dependencies for existing regression tests
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          npx playwright install --with-deps chromium
      - name: Apply scoped patch and verify unchanged approved GitHub media
        run: |
          node .github/prepare-story-render-fix.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/story-render-freigabe.test.mjs')
          t = p.read_text()
          a = '    if (["frage", "antwort"].includes(p.art)) assert.equal(quizPaarFreigabe(p, plan.stories, lesen).status, "frei");'
          b = '''    if (["frage", "antwort"].includes(p.art)) {
                const paar = quizPaarFreigabe(p, plan.stories, lesen);
                assert.equal(paar.status, "frei", p.slot + ": " + paar.grund);
                // Simulate successful question publication locally; never call Instagram.
                if (p.art === "frage") p.status = "veroeffentlicht";
              }'''
          assert t.count(a) == 1
          t = t.replace(a, b)
          a = '  const before = JSON.stringify(vp.tag);'
          b = a + '\n  const antwort = plan.stories.find((p) => p.art === "antwort");\n  assert.equal(quizPaarFreigabe(antwort, plan.stories, lesen).status, "warten", "answer must wait for question publication");'
          assert t.count(a) == 1
          t = t.replace(a, b).replace('new FormData()', 'new globalThis.FormData()')
          p.write_text(t)
          # Preserve existing manual-finalization semantics. The new hash-bound
          # exemption itself refuses pending/unknown findings, without changing
          # unrelated short stories or weakening other existing checks.
          p = Path('src/pruefung.mjs')
          t = p.read_text()
          a = '''  if (manuellFinalisiert(story) && (story.faktencheckOffen || (story.beanstandetFachlich || []).length || ((story.beanstandet || []).length && !story.befundeTypisiert))) {
              return { frei: false, warten: true, grund: "Offene fachliche/ungeklaerte Befunde bleiben trotz Sichtfreigabe gesperrt" };
            }
          '''
          assert t.count(a) == 1
          p.write_text(t.replace(a, ''))
          # The existing source-wiring assertion must include the verified
          # preproduction context now passed to the same approval function.
          p = Path('test/bot.test.mjs')
          t = p.read_text()
          a = r'/const freigabe = storyFreigabe\(story\);/'
          b = r'/const freigabe = storyFreigabe\(story, \{ vorproduktion \}\);/'
          assert t.count(a) == 1
          p.write_text(t.replace(a, b))
          PY
      - name: Offline regression tests, including actual tomorrow's assets
        shell: bash
        env:
          # Local decryption only, not a provider/API credential.
          IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
        run: |
          cat > .tmp/no-network.mjs <<'NODE'
          import http from 'node:http';
          import https from 'node:https';
          const deny = () => { throw new Error('NETWORK_DISABLED_DURING_TESTS'); };
          globalThis.fetch = async () => deny();
          http.request = deny;
          http.get = deny;
          https.request = deny;
          https.get = deny;
          NODE
          export IG_PREFLIGHT_ASSET_DIR="$PWD/.tmp/story-gate-assets"
          export NODE_OPTIONS="--import=$PWD/.tmp/no-network.mjs"
          node --test test/story-render-freigabe.test.mjs
          node --test test/*.test.mjs > /tmp/story-fix-suite.log 2>&1 || { tail -100 /tmp/story-fix-suite.log; grep -A 25 '^not ok' /tmp/story-fix-suite.log; exit 1; }
          tail -12 /tmp/story-fix-suite.log
          git diff --check
      - name: Lint changed production and test files
        run: ./node_modules/.bin/eslint src/story-render-freigabe.mjs src/provider-kostensperre.mjs src/pruefung.mjs src/lauf.mjs src/anbieter.mjs src/stimme.mjs src/stimmen.mjs test/story-render-freigabe.test.mjs test/bot.test.mjs
      - name: Commit tested code and approval records to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pruefung.mjs src/lauf.mjs src/anbieter.mjs src/stimme.mjs src/stimmen.mjs .github/workflows/instagram.yml config/story-render-freigaben.json test/story-render-freigabe.test.mjs test/bot.test.mjs
          git commit -m 'fix: approve exact visible story renders and forbid paid APIs in Instagram runs'
          git push origin HEAD:fix/visuelle-story-freigabe-ohne-api-kosten
          git rev-parse HEAD
