name: Reichweiten-Vorschläge · beide Kanäle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reichweite.yml"
      - "reichweite/**"
  schedule:
    - cron: "23 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reichweite-beide-kanaele
  cancel-in-progress: true

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Herr-Jurist-Posts finden und verschlüsseln
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          REICHWEITE_KANAL: herrjurist
          REICHWEITE_OUT: ${{ github.workspace }}/out/herrjurist.enc.json
        run: node reichweite/sammeln.mjs

      - name: Examenscampus-Posts mit demselben Meta-Public-Content-Zugang finden
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          REICHWEITE_KANAL: examenscampus
          REICHWEITE_OUT: ${{ github.workspace }}/out/examenscampus.enc.json
        run: node reichweite/sammeln.mjs

      - name: Nur verschlüsselte Datenblöcke aktualisieren
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin reichweite-data
          rm -rf /tmp/reichweite-data
          git worktree add --detach /tmp/reichweite-data origin/reichweite-data
          cd /tmp/reichweite-data
          git switch -C reichweite-data origin/reichweite-data
          mkdir -p reichweite
          cp "$GITHUB_WORKSPACE/out/herrjurist.enc.json" reichweite/data.enc.json
          cp "$GITHUB_WORKSPACE/out/examenscampus.enc.json" reichweite/examenscampus.enc.json
          git add reichweite/data.enc.json reichweite/examenscampus.enc.json
          git commit -m "data: Reichweiten-Vorschläge beide Kanäle $(date -u +%F-%H%M)" || exit 0
          git push origin HEAD:reichweite-data
