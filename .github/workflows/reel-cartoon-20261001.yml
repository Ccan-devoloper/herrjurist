name: 01.10. Staatsrecht – Reel review with fixed character voices
on:
  push:
    branches: [codex/reel-test-20261001-v1]
    paths:
      - 'reel-2026-10-01/**'
      - '.github/workflows/reel-cartoon-20261001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg fonts-urw-base35 >/dev/null
          python -m pip install --disable-pip-version-check pillow
      - name: Synthesize approved narrator, Mara, SFX and render review
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node reel-2026-10-01/render.mjs
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-2026-10-01-subsidiaritaet-review
          path: |
            reel-2026-10-01/out/herrjurist-2026-10-01-subsidiaritaet-review.mp4
            reel-2026-10-01/out/cover.jpg
            reel-2026-10-01/out/timing.json
            reel-2026-10-01/out/untertitel-sinngruppen.ass
            reel-2026-10-01/audio/*.mp3
            reel-2026-10-01/audio/*.json
          if-no-files-found: warn
          retention-days: 30
