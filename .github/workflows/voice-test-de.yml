name: One-off German legal pronunciation and transcription test
on:
  push:
    paths:
      - .github/workflows/voice-test-de.yml
permissions:
  contents: read
jobs:
  test-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node bin/voice-test-de.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-de
          path: voice-test-de/
