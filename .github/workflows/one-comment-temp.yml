name: Temporary single-comment reply

on:
  push:
    branches: [chatgpt/one-comment-20260924]
    paths:
      - ".github/workflows/one-comment-temp.yml"

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to exactly one Instagram comment
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
        run: |
          node <<'NODE'
          const commentId = "18119278927934336";
          const message = "Genau – wichtiger Examenspunkt. Nur die Präzisierung: Intendiertes Ermessen ersetzt nicht die Spruchreife. Vornahmeurteil nur, wenn konkret nur eine rechtmäßige Entscheidung verbleibt; sonst Bescheidungsurteil nach § 113 Abs. 5 S. 2 VwGO.";
          const host = process.env.IG_GRAPH_HOST || "instagram";
          const version = process.env.IG_GRAPH_VERSION || "v23.0";
          const base = host === "facebook"
            ? `https://graph.facebook.com/${version}`
            : `https://graph.instagram.com/${version}`;
          const token = process.env.IG_ACCESS_TOKEN;

          const meUrl = new URL(`${base}/me`);
          meUrl.search = new URLSearchParams({ fields: "username", access_token: token });
          const meRes = await fetch(meUrl);
          const me = await meRes.json();
          if (!meRes.ok) throw new Error("Could not read own username: " + JSON.stringify(me));

          const readUrl = new URL(`${base}/${commentId}`);
          readUrl.search = new URLSearchParams({
            fields: "id,text,replies.limit(50){id,text,username,from{id,username},timestamp}",
            access_token: token,
          });
          const readRes = await fetch(readUrl);
          const current = await readRes.json();
          if (!readRes.ok) throw new Error("Could not read target comment: " + JSON.stringify(current));

          const ownReply = (current.replies?.data || []).find(r =>
            (r.username || r.from?.username || "").toLowerCase() === String(me.username || "").toLowerCase()
          );
          if (ownReply) {
            console.log("ALREADY_REPLIED=" + ownReply.id);
            process.exit(0);
          }

          const body = new URLSearchParams({ message, access_token: token });
          const postRes = await fetch(`${base}/${commentId}/replies`, {
            method: "POST",
            headers: { "content-type": "application/x-www-form-urlencoded" },
            body,
          });
          const posted = await postRes.json();
          if (!postRes.ok) throw new Error("Reply failed: " + JSON.stringify(posted));
          console.log("REPLY_POSTED=" + posted.id);
          console.log("REPLY_TEXT=" + message);
          NODE
