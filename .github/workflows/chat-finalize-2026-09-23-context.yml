name: Chat finalize 2026-09-23 · verify b3 v3 reuse
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse exact approved v3 reel without provider credentials
        env:
          IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/Ccan-devoloper/herrjurist/instagram-assets/state/inhalte/2026-09-23-b3.json -o /tmp/b3.json
          cat > .chat-v3-reuse.mjs <<'NODE'
          import fs from "node:fs";
          import { reelBauen } from "./src/reel.mjs";
          const reel=JSON.parse(fs.readFileSync("/tmp/b3.json","utf8"));
          const r=await reelBauen(reel,"/tmp/reuse-v3",{datum:"2026-09-23",layout:"erklaer"});
          if(Math.abs(r.dauer-87.96)>0.001) throw new Error("duration mismatch");
          if(!fs.existsSync(r.video)||fs.statSync(r.video).size<100000) throw new Error("video missing");
          if(!fs.existsSync(r.cover)||fs.statSync(r.cover).size<10000) throw new Error("cover missing");
          console.log(JSON.stringify({ok:true,dauer:r.dauer,layout:r.layout,anbieter:r.anbieter,videoBytes:fs.statSync(r.video).size,coverBytes:fs.statSync(r.cover).size}));
          NODE
          node .chat-v3-reuse.mjs
          rm .chat-v3-reuse.mjs
