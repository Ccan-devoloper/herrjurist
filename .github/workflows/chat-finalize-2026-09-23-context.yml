name: Export final b3 v2 package 2026-09-23
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram-assets
      - name: Build ZIP payload
        run: |
          mkdir -p export/final export/scenes export/qa export/state
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v2.mp4 export/final/
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-cover-v2.jpg export/final/
          cp vorschau/2026-09-23/b3-scenes-final-v1/scene-*.png export/scenes/
          cp vorschau/2026-09-23/b3-scenes-final-v1/manifest.json export/scenes/
          cp vorschau/2026-09-23/b3-full-motive-qa-v2/frame-*.jpg export/qa/
          cp vorschau/2026-09-23/b3-full-motive-qa-v2/render.json export/qa/
          cp state/inhalte/2026-09-23-b3.json export/state/
          cat > export/README.txt <<'TXT'
          Herr Jurist · b3 · 2026-09-23 · final v2

          final/
            Finales Reel v2 (MP4) und finales Cover v2 (JPG)
          scenes/
            Fünf unterschiedliche Reel-Motive + Manifest
          qa/
            QA-Frames des v2-Renders mit vollständig sichtbaren Motiven
          state/
            Finaler Inhaltsstand aus state/inhalte/2026-09-23-b3.json

          Finaler Stand:
            7 Szenen
            5 unterschiedliche Motive
            Reel-Dauer 87,38 s
            Layout: Erklärvideo
            Stimme: Piper
            Motive vollständig innerhalb der 9:16-Szene
            manuellGeprueft: true
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: herrjurist-b3-final-v2-2026-09-23
          path: export
          if-no-files-found: error
          retention-days: 7
