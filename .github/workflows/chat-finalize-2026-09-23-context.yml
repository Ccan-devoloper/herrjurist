name: Export final b3 package 2026-09-23
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram-assets
      - name: Build ZIP payload
        run: |
          mkdir -p export/final export/scenes export/qa export/state
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v1.mp4 export/final/
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-cover-v1.jpg export/final/
          cp vorschau/2026-09-23/b3-scenes-final-v1/scene-*.png export/scenes/
          cp vorschau/2026-09-23/b3-scenes-final-v1/manifest.json export/scenes/
          cp vorschau/2026-09-23/b3-qa-final-v1/qa-*.jpg export/qa/
          cp vorschau/2026-09-23/b3-stable-qa-v1/frame-*.jpg export/qa/
          cp state/inhalte/2026-09-23-b3.json export/state/
          cat > export/README.txt <<'TXT'
          Herr Jurist · b3 · 2026-09-23
          Thema: Anwaltsklausur: Klageerwiderung und Verteidigungsstrategie

          final/
            Finales Reel (MP4) und finales Cover (JPG)
          scenes/
            Fünf unterschiedliche Reel-Motive + Manifest
          qa/
            QA-Frames und stabile Kontrollframes
          state/
            Finaler Inhaltsstand aus state/inhalte/2026-09-23-b3.json

          Finaler Stand:
            7 Szenen
            5 unterschiedliche Motive
            Reel-Dauer 87,56 s
            Layout: Erklärvideo
            Stimme: Piper
            manuellGeprueft: true
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: herrjurist-b3-final-2026-09-23
          path: export
          if-no-files-found: error
          retention-days: 7
