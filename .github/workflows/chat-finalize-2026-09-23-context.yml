name: Chat finalize 2026-09-23 · free b3 cover reuse
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: write
jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare existing approved character scene
        run: |
          git fetch origin instagram-assets:refs/remotes/origin/instagram-assets
          git show origin/instagram-assets:vorschau/2026-09-23/b3-2026-09-23-b3-cover-mudqqa82.jpg > /tmp/b3-source.jpg
          ffmpeg -y -hide_banner -loglevel error -i /tmp/b3-source.jpg -vf "crop=1080:1200:0:720" /tmp/b3-scene.jpg
      - name: Render corrected cover without paid providers
        run: |
          cat > .chat-b3-cover.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { chromium } from "playwright";
          import { coverHtml } from "./src/vorlagen.mjs";
          import { kontext } from "./src/render.mjs";

          const scene = `data:image/jpeg;base64,${fs.readFileSync("/tmp/b3-scene.jpg").toString("base64")}`;
          const ctx = kontext({
            fach: "assessorz",
            klausur: 1,
            fachLabel: "Zivilrechtliche Assessorklausur",
            variante: 0,
          });
          const daten = {
            titel: "Klageerwiderung mit Verteidigungsstrategie",
            titelZeilen: ["Klageerwiderung", "Verteidigung", "mit Strategie"],
            coverBadge: "Anwaltsklausur",
            fach: "assessorz",
            klausur: 1,
            fachLabel: "Zivilrechtliche Assessorklausur",
            icon: "dokument",
          };
          let html = coverHtml(daten, ctx);
          html = html.replace("</style>", `
            .story.cover .buehne{display:none!important}
            .story.cover .fuss{display:none!important}
            .story.cover h1.titel-stack{font-size:103px!important;line-height:1.01!important;gap:9px!important;margin-top:112px!important;position:relative;z-index:6}
            .story.cover h1.titel-stack .titel-zeile{max-width:900px!important;padding:13px 31px 15px!important}
            .story.cover .cover-badge{position:relative;z-index:6;margin-top:18px!important}
            .story.cover .kopf,.story.cover .reelmarke{z-index:8}
            .scene-reuse{position:absolute;left:0;top:720px;width:1080px;height:1200px;object-fit:cover;z-index:1}
            .reuse-note{position:absolute;left:430px;top:735px;width:390px;z-index:7;font-family:"Caveat";font-size:58px;line-height:1.01;font-weight:700;color:var(--text);text-align:center;transform:rotate(-4deg);transform-origin:center center}
          </style>`);
          html = html.replace('<div class="story cover">', '<div class="story cover"><img class="scene-reuse" src="'+scene+'" alt="">');
          html = html.replace("</div></body></html>", '<div class="reuse-note">Angriffspunkt zuerst</div></div></body></html>');

          const browser = await chromium.launch({args:["--font-render-hinting=none"]});
          const page = await browser.newPage({viewport:{width:1080,height:1920},deviceScaleFactor:1});
          const tmp="/tmp/b3-final.html";
          fs.writeFileSync(tmp,html);
          await page.goto("file://"+tmp,{waitUntil:"load"});
          await page.evaluate(()=>document.fonts.ready);
          await page.screenshot({path:"/tmp/2026-09-23-b3-cover-final-free.jpg",type:"jpeg",quality:92,fullPage:false});
          await page.close();
          await browser.close();
          NODE
          node .chat-b3-cover.mjs
          rm .chat-b3-cover.mjs
      - name: Store preview in asset branch
        run: |
          git worktree add -B chat-assets /tmp/assets origin/instagram-assets
          mkdir -p /tmp/assets/vorschau/2026-09-23
          cp /tmp/2026-09-23-b3-cover-final-free.jpg /tmp/assets/vorschau/2026-09-23/b3-2026-09-23-b3-cover-final-free.jpg
          cd /tmp/assets
          git config user.name instagram-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vorschau/2026-09-23/b3-2026-09-23-b3-cover-final-free.jpg
          git commit -m "Vorschau b3 final kostenlos 2026-09-23"
          git push origin HEAD:instagram-assets
