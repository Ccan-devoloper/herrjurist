name: Chat finalize 2026-09-23 · free b3 cover reuse v3
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: write
jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Reuse existing approved Mara-Zylla scene and redraw only cover text
        run: |
          git fetch origin instagram-assets:refs/remotes/origin/instagram-assets
          git show origin/instagram-assets:vorschau/2026-09-23/b3-2026-09-23-b3-cover-mudqqa82.jpg > /tmp/source.jpg
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          src=Image.open("/tmp/source.jpg").convert("RGB")
          W,H=src.size
          bg=src.getpixel((20,700))
          dark=(8,31,70)
          white=(255,255,255)
          cream=(255,240,214)

          # Reuse only the already-paid lower Mara/Zylla scene.
          # The entire former text/layout zone is discarded, so no old pills or note can leak through.
          out=Image.new("RGB",(W,H),bg)
          out.paste(src.crop((0,800,W,H)),(0,800))
          d=ImageDraw.Draw(out)

          inter=ImageFont.truetype("fonts/Inter.ttf", 26)
          title_font=ImageFont.truetype("fonts/Inter.ttf", 92)
          badge_font=ImageFont.truetype("fonts/Inter.ttf", 27)
          caveat=ImageFont.truetype("fonts/Caveat.ttf", 58)

          # Fachband
          d.polygon([(0,0),(455,0),(421,63),(0,63)], fill=dark)
          d.text((34,16),"Zivilrechtliche Assessorklausur",font=inter,fill=white)

          # Reel badge
          d.rounded_rectangle((738,34,856,86), radius=26, fill=dark)
          rb=d.textbbox((0,0),"REEL",font=inter)
          d.text((797-(rb[2]-rb[0])/2,60-(rb[3]-rb[1])/2-4),"REEL",font=inter,fill=white)

          # Compact three-line title; no clipping.
          lines=[("Klageerwiderung",165),("Verteidigung",287),("mit Strategie",409)]
          for txt,y in lines:
              box=d.textbbox((0,0),txt,font=title_font)
              tw=box[2]-box[0]; th=box[3]-box[1]
              x=72; px=30; py=16
              d.rounded_rectangle((x,y,x+tw+2*px,y+th+2*py),radius=34,fill=dark)
              d.text((x+px,y+py-7),txt,font=title_font,fill=white)

          bx,by=82,557
          btxt="Anwaltsklausur"
          bb=d.textbbox((0,0),btxt,font=badge_font)
          bw=bb[2]-bb[0]; bh=bb[3]-bb[1]
          d.rounded_rectangle((bx,by,bx+bw+42,by+bh+24),radius=26,fill=cream)
          d.text((bx+21,by+9),btxt,font=badge_font,fill=dark)

          # No arrow. Handwritten editorial cue sits in genuinely free space.
          note="Angriffspunkt\nzuerst"
          nb=d.multiline_textbbox((0,0),note,font=caveat,spacing=-4,align="center")
          nw=nb[2]-nb[0]
          d.multiline_text((510-nw/2,635),note,font=caveat,fill=dark,spacing=-4,align="center")

          out.save("/tmp/2026-09-23-b3-cover-final-free-v3.jpg",quality=94,subsampling=0)
          PY
      - name: Store corrected cover preview in asset branch
        run: |
          git worktree add -B chat-assets /tmp/assets origin/instagram-assets
          mkdir -p /tmp/assets/vorschau/2026-09-23
          cp /tmp/2026-09-23-b3-cover-final-free-v3.jpg /tmp/assets/vorschau/2026-09-23/b3-2026-09-23-b3-cover-final-free-v3.jpg
          cd /tmp/assets
          git config user.name instagram-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vorschau/2026-09-23/b3-2026-09-23-b3-cover-final-free-v3.jpg
          git commit -m "Vorschau b3 final kostenlos v3 2026-09-23"
          git push origin HEAD:instagram-assets
