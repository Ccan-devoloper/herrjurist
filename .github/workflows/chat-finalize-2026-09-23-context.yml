name: Chat finalize 2026-09-23 · b3 stable QA frames
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract stable frames from already-rendered reel
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          git fetch origin instagram-assets:refs/remotes/origin/instagram-assets
          git worktree add -B chat-assets /tmp/assets origin/instagram-assets
          video=/tmp/assets/vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v1.mp4
          out=/tmp/assets/vorschau/2026-09-23/b3-stable-qa-v1
          mkdir -p "$out"
          for t in 58 62 66 70 74 78; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$video" -frames:v 1 -q:v 2 "$out/frame-${t}s.jpg"
          done
          cd /tmp/assets
          git config user.name instagram-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vorschau/2026-09-23/b3-stable-qa-v1
          git commit -m "Extrahiere stabile QA-Frames fuer b3-Reel"
          git pull --rebase origin instagram-assets
          git push origin HEAD:instagram-assets
