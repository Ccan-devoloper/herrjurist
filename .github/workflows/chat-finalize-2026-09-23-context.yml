name: Chat finalize 2026-09-23 · decrypt planned context
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export metadata around today's preplanned topic records
        env:
          IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
        run: |
          mkdir -p out/chat-context
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { THEMEN } from "./daten/themen.mjs";
          const ids = ["assessoroer-837","assessorz-582","strafat-724","staat-088","sachen-509","zpo-278","assessorz-576"];
          const prefixes = [...new Set(ids.map(x => x.split("-")[0]))];
          const exact = ids.map(id => THEMEN.find(t => String(t.id) === id)).filter(Boolean);
          const byPrefix = Object.fromEntries(prefixes.map(p => [p, THEMEN.filter(t => String(t.id||"").startsWith(p+"-")).slice(-25)]));
          fs.writeFileSync("out/chat-context/topics.json", JSON.stringify({
            count: THEMEN.length,
            sample: THEMEN.slice(0,5),
            ids,
            exact,
            missing: ids.filter(id => !exact.some(t => String(t.id) === id)),
            byPrefix
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: chat-finalize-2026-09-23-context
          path: out/chat-context
          if-no-files-found: error
          retention-days: 1
