name: Export final b3 v3 zoom package 2026-09-23
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram-assets
      - name: Add current renderer code
        run: |
          mkdir -p export/final export/scenes export/qa export/state export/code
          git show origin/main:src/erklaervideo.mjs > export/code/erklaervideo.mjs
          git show origin/main:test/bot.test.mjs > export/code/bot.test.mjs
      - name: Build ZIP payload
        run: |
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v3.mp4 export/final/
          cp vorschau/2026-09-23/b3-2026-09-23-b3-final-cover-v3.jpg export/final/
          cp vorschau/2026-09-23/b3-scenes-final-v1/scene-*.png export/scenes/
          cp vorschau/2026-09-23/b3-scenes-final-v1/manifest.json export/scenes/
          cp vorschau/2026-09-23/b3-zoom-qa-v3/frame-*.jpg export/qa/
          cp vorschau/2026-09-23/b3-zoom-qa-v3/zoom-check-*.jpg export/qa/
          cp vorschau/2026-09-23/b3-zoom-qa-v3/render.json export/qa/
          cp state/inhalte/2026-09-23-b3.json export/state/
          cat > export/README.txt <<'TXT'
          Herr Jurist · b3 · 2026-09-23 · final v3

          final/
            Finales Reel v3 (MP4) und finales Cover v3 (JPG)

          scenes/
            Fünf unterschiedliche, bereits erzeugte Reel-Motive + Manifest

          qa/
            QA-Frames des v3-Renders
            zoom-check-45s.jpg und zoom-check-49s.jpg zeigen denselben Szeneninhalt
            zu zwei Zeitpunkten und machen den subtilen Zoom nachvollziehbar.

          state/
            Finaler Inhaltsstand aus state/inhalte/2026-09-23-b3.json

          code/
            Aktueller Reel-Renderer und Regressionstest aus main

          Finaler Stand:
            7 Szenen
            5 unterschiedliche Motive
            Motive vollständig innerhalb der 9:16-Szene
            leichter kontinuierlicher Zoom nach dem Einflug: 1,0000 -> max. 1,0250
            Reel-Dauer 87,96 s
            Layout: Erklärvideo
            Stimme: Piper
            manuellGeprueft: true
            zusätzliche Bild-/LLM-Providerkosten für diesen Rerender: 0 $
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: herrjurist-b3-final-v3-zoom-2026-09-23
          path: export
          if-no-files-found: error
          retention-days: 7
