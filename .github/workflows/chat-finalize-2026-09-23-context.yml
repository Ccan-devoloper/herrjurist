name: Chat finalize 2026-09-23 · b3 subtle-zoom rerender
on:
  push:
    branches: [chat-finalize-2026-09-23-context]
    paths: [.github/workflows/chat-finalize-2026-09-23-context.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google.list || true
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Free local render dependencies
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            mkdir -p ~/.cache/piper-voices
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi
      - name: Rerender approved b3 with subtle scene zoom
        env:
          IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
          IG_STIMME: "piper"
        run: |
          git fetch origin instagram-assets:refs/remotes/origin/instagram-assets
          git show origin/instagram-assets:state/inhalte/2026-09-23-b3.json > /tmp/b3.json
          cat > .chat-rerender-b3-zoom.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { reelBauen } from "./src/reel.mjs";
          import { browserBeenden } from "./src/render.mjs";

          const reel=JSON.parse(fs.readFileSync("/tmp/b3.json","utf8"));
          delete reel.reelFinalUrl;
          delete reel.reelFinalDauer;
          delete reel.reelFinalLayout;
          delete reel.reelFinalStimmeAnbieter;

          // Materialize already-paid scene assets locally. No image provider calls.
          const motiveDir="/tmp/b3-v3-motive";
          fs.mkdirSync(motiveDir,{recursive:true});
          const materialize=async (value,name)=>{
            if(!/^https:\/\//.test(String(value||""))) return value;
            const u=new URL(value);
            if(u.protocol!=="https:" || u.hostname!=="raw.githubusercontent.com") throw new Error("unexpected motive host");
            const r=await fetch(u);
            if(!r.ok) throw new Error(`motive download HTTP ${r.status}`);
            const ext=/\.jpe?g(?:\?|$)/i.test(u.pathname)?".jpg":".png";
            const p=path.join(motiveDir,name+ext);
            fs.writeFileSync(p,Buffer.from(await r.arrayBuffer()));
            return p;
          };
          for(let i=0;i<(reel.szenen||[]).length;i++){
            reel.szenen[i].bild=await materialize(reel.szenen[i].bild,`scene-${i}`);
            reel.szenen[i].medaillon=await materialize(reel.szenen[i].medaillon,`med-${i}`);
          }

          const out="/tmp/b3-v3";
          fs.mkdirSync(out,{recursive:true});
          const r=await reelBauen(reel,out,{
            datum:"2026-09-23",
            layout:"erklaer",
            framesBehalten:true
          });
          fs.writeFileSync("/tmp/b3-v3-result.json",JSON.stringify({
            dauer:r.dauer,anbieter:r.anbieter,layout:r.layout,
            video:r.video,cover:r.cover,
            zoom:"scene motive scale 1.0000 -> 1.0250 after entrance"
          },null,2));
          await browserBeenden();
          NODE
          node .chat-rerender-b3-zoom.mjs
          rm .chat-rerender-b3-zoom.mjs

          git worktree add -B chat-assets /tmp/assets origin/instagram-assets
          mkdir -p /tmp/assets/vorschau/2026-09-23/b3-zoom-qa-v3
          cp /tmp/b3-v3/2026-09-23-b3.mp4 /tmp/assets/vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v3.mp4
          cp /tmp/b3-v3/2026-09-23-b3-cover.jpg /tmp/assets/vorschau/2026-09-23/b3-2026-09-23-b3-final-cover-v3.jpg

          video=/tmp/b3-v3/2026-09-23-b3.mp4
          for t in 8 20 33 45 58 70 82; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$video" -frames:v 1 -q:v 2 "/tmp/assets/vorschau/2026-09-23/b3-zoom-qa-v3/frame-${t}s.jpg"
          done
          # Extra same-scene pairs to make the subtle zoom inspectable.
          for t in 8 11 45 49; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$video" -frames:v 1 -q:v 2 "/tmp/assets/vorschau/2026-09-23/b3-zoom-qa-v3/zoom-check-${t}s.jpg"
          done
          cp /tmp/b3-v3-result.json /tmp/assets/vorschau/2026-09-23/b3-zoom-qa-v3/render.json

          cd /tmp/assets
          git config user.name instagram-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vorschau/2026-09-23/b3-2026-09-23-b3-final-reel-v3.mp4                   vorschau/2026-09-23/b3-2026-09-23-b3-final-cover-v3.jpg                   vorschau/2026-09-23/b3-zoom-qa-v3
          git commit -m "Rendere b3 mit leichtem Zoom der vollständig sichtbaren Motive"
          git pull --rebase origin instagram-assets
          git push origin HEAD:instagram-assets
