name: YouTube Willenserklärung · überarbeitete Freigabefassung
on:
  push:
    branches: [codex/youtube-willenserklaerung-v1]
    paths:
      - '.github/workflows/youtube-willenserklaerung-revision.yml'
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Nur den letzten Erzähler-Take mit derselben Stimme erneuern
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HERR_JURIST_AUDIO_ONLY: 09-schluss-01
        run: node youtube/willenserklaerung/generate-audio.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Werkzeuge installieren
        run: |
          python -m pip install --quiet Pillow==12.3.0
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Bildkarten und synchronisierte Tonspur aufbauen
        run: |
          python youtube/willenserklaerung/render.py
          python youtube/willenserklaerung/thumbnail.py
      - name: 16:9-MP4 exportieren
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i youtube/willenserklaerung/work/slides.txt \
            -i youtube/willenserklaerung/work/master.wav \
            -vf ass=youtube/willenserklaerung/work/captions.ass \
            -fps_mode cfr -r 30 -c:v libx264 -preset veryfast -crf 20 \
            -pix_fmt yuv420p -c:a aac -ar 48000 -b:a 192k \
            -af 'loudnorm=I=-16:TP=-1.5:LRA=11,aresample=48000' \
            -shortest -movflags +faststart \
            youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4
      - name: Export und Schluss prüfen
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,sample_rate \
            -of json youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4
          test -s youtube/willenserklaerung/willenserklaerung.de.srt
          grep -q 'Bis zum nächsten Thema!' youtube/willenserklaerung/willenserklaerung.de.srt
          test "$(find youtube/willenserklaerung/work -maxdepth 1 -name 'slide-*.jpg' | wc -l)" -eq 43
      - name: Revidierte Fassung in den Review-Branch schreiben
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube/willenserklaerung/audio/09-schluss-01.mp3 \
            youtube/willenserklaerung/audio/09-schluss-01.json \
            youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4 \
            youtube/willenserklaerung/willenserklaerung.de.srt
          git commit -m 'Remove overlays and endcard; revise narrator closing'
          git push origin HEAD:codex/youtube-willenserklaerung-v1
