name: Kit-Wochenbrief terminieren

on:
  # Mehrere Gelegenheiten am Sonntagmorgen; das Skript ist idempotent.
  schedule:
    - cron: '17 6,7,8 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, nichts terminieren'
        required: true
        default: true
        type: boolean
      as_of:
        description: 'Nur für Dry Run: ISO-Testzeitpunkt, z. B. 2026-10-11T06:20:00Z'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kit-wochenbrief
  cancel-in-progress: false

jobs:
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wochenbrief prüfen und gegebenenfalls terminieren
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_ADDRESS: ${{ vars.KIT_FROM_ADDRESS }}
          DRY_RUN: ${{ inputs.dry_run }}
          KIT_TEST_NOW: ${{ inputs.as_of }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node bin/kit-wochenbrief-planen.mjs --dry-run
          else
            node bin/kit-wochenbrief-planen.mjs
          fi
