name: YouTube Notwehr · ElevenLabs
on:
  push:
    branches: [codex/youtube-notwehr-audio]
    paths:
      - 'youtube/notwehr/generate-audio.mjs'
      - 'youtube/notwehr/script.json'
      - '.github/workflows/youtube-notwehr-audio.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprecher und Charaktere erzeugen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node youtube/notwehr/generate-audio.mjs
      - name: Sprachdateien und Alignments sichern
        uses: actions/upload-artifact@v4
        with:
          name: youtube-notwehr-audio
          path: youtube/notwehr/audio/
          if-no-files-found: error
          retention-days: 7
