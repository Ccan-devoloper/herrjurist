name: One-off German ElevenLabs voice inspection
on:
  push:
    paths:
      - .github/workflows/inspect-elevenlabs.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node bin/inspect-elevenlabs.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-inspection
          path: voice-inspection.json
