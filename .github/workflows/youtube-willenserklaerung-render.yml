name: YouTube Willenserklärung · finaler 16:9-Render

on:
  push:
    branches: [codex/youtube-willenserklaerung-v1]
    paths:
      - '.github/workflows/youtube-willenserklaerung-render.yml'
      - 'youtube/willenserklaerung/render.trigger'

permissions:
  actions: read
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bild- und Videowerkzeuge
        run: |
          python -m pip install --quiet Pillow==12.3.0
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Festgelegte Erzähler-Takes und Zeitmarken laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p youtube/willenserklaerung/audio
          gh run download 36358083600 --repo '${{ github.repository }}' --name youtube-willenserklaerung-audio --dir youtube/willenserklaerung/audio
      - name: Bildzustände, Ton und Untertitel aufbauen
        run: |
          python youtube/willenserklaerung/render.py
          python youtube/willenserklaerung/thumbnail.py
      - name: YouTube-MP4 exportieren
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i youtube/willenserklaerung/work/slides.txt \
            -i youtube/willenserklaerung/work/master.wav \
            -vf ass=youtube/willenserklaerung/work/captions.ass \
            -fps_mode cfr -r 30 -c:v libx264 -preset veryfast -crf 20 \
            -pix_fmt yuv420p -c:a aac -ar 48000 -b:a 192k \
            -af 'loudnorm=I=-16:TP=-1.5:LRA=11,aresample=48000' \
            -shortest -movflags +faststart \
            youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4
      - name: Exportdaten prüfen
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,sample_rate \
            -of json youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4
          test -s youtube/willenserklaerung/willenserklaerung.de.srt
          test -s youtube/willenserklaerung/willenserklaerung-thumbnail.jpg
      - name: Freigabefassung und Ton-Masters im Testbranch sichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube/willenserklaerung/audio \
            youtube/willenserklaerung/willenserklaerung-herr-jurist-16x9.mp4 \
            youtube/willenserklaerung/willenserklaerung.de.srt \
            youtube/willenserklaerung/willenserklaerung-thumbnail.jpg
          git commit -m 'Render reviewed Willenserklärung YouTube pilot with locked voice takes'
          git push origin HEAD:codex/youtube-willenserklaerung-v1
