name: Charakter-Cover · Einmalige Probe
# Trigger: 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/charakter-test-run.yml"

permissions:
  contents: read

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/charakter-cover-sunburst
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install --quiet "rembg[cli]" onnxruntime
      - run: git fetch origin instagram-assets:refs/remotes/origin/instagram-assets
      - name: Zehn echte Trockenrenderings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
          IG_CHARAKTERE: "true"
          IG_CHARAKTER_MODELL: "gpt-image-2.5-sunburst-2026-09-08"
          IG_CHARAKTER_GUETE: "medium"
          IG_CHARAKTER_RETRY_GUETE: "high"
        run: node bin/charakter-trockenlauf.mjs
      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charakter-trockenlauf-${{ github.run_id }}
          path: out/charakter-test
          if-no-files-found: error
          retention-days: 7
