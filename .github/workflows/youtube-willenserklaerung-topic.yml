name: Willenserklärung · Themenpool-Abgleich (verschlüsselt)
on:
  push:
    branches: [codex/youtube-willenserklaerung-test]
    paths:
      - '.github/workflows/youtube-willenserklaerung-topic.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Passende Themen lokal entschlüsseln und nur verschlüsselt exportieren
        run: node youtube/willenserklaerung/check-topic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: willenserklaerung-topic-review-encrypted
          path: youtube/willenserklaerung/work/topic.enc.json
          retention-days: 1
