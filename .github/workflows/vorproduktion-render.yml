name: Vorproduktion · Herr Jurist rendern

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/render.trigger"
  workflow_dispatch:

permissions:
  contents: write

# Derselbe Schreib-Lock wie beim Live-Instagram-Job: Budget-Journal,
# Kostenledger und Previewdateien liegen gemeinsam auf instagram-assets.
concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      IG_STIL: "bunt"
      IG_BILDER: "true"
      IG_BILD_KI: "true"
      IG_CHARAKTERE: "true"
      IG_CHARAKTER_MODELL: "gpt-image-2.5-sunburst-2026-09-08"
      IG_CHARAKTER_GUETE: "high"
      IG_CHARAKTER_RETRY_GUETE: "xhigh"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      ELEVENLABS_API_KEY: ""
      IG_VORPRODUKTION_BILD_BUDGET_USD: "2.00"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Freisteller, ffmpeg und Piper
        run: |
          pip install --quiet "rembg[cli]" onnxruntime piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Zwei Tage vollständig als Review-Vorschau rendern
        run: node bin/vorproduktion-rendern.mjs 2026-09-24 2026-09-25

      - name: Telemetrie sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-telemetrie-${{ github.run_id }}
          path: /tmp/herrjurist-vorproduktion-*/telemetrie/telemetrie.ndjson
          if-no-files-found: ignore
          retention-days: 30
