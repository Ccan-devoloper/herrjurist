name: Vorproduktion · rollierend rendern

# Das Jahr ist redaktionell im Repository vorgeschrieben (vorproduktion/<datum>.json).
# Gerendert und in den Asset-Zweig übernommen werden nur die nächsten 14 Tage –
# täglich nachts, außerhalb der Veröffentlichungszeiten. Providerfrei (Piper offline).
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      horizont:
        description: "Tage im Voraus"
        required: false
        default: "14"
      max:
        description: "Höchstens so viele Tage je Lauf"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      IG_REEL_LAYOUT: "erklaer"
      IG_VORPRODUKTION_HORIZONT: ${{ inputs.horizont || '14' }}
      IG_VORPRODUKTION_MAX_JE_LAUF: ${{ inputs.max || '4' }}
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Fällige Tage bestimmen
        id: faellig
        run: node bin/vorproduktion-rollierend.mjs >> "$GITHUB_OUTPUT"

      - name: Chromium
        if: steps.faellig.outputs.tage != ''
        run: npx playwright install --with-deps chromium

      - name: ffmpeg und Piper offline
        if: steps.faellig.outputs.tage != ''
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Übernehmen und rendern
        if: steps.faellig.outputs.tage != ''
        run: |
          node bin/vorproduktion-tage-uebernehmen.mjs ${{ steps.faellig.outputs.tage }}
          rm -f vorproduktion/review-render-only.trigger
          node bin/vorproduktion-ohne-coverbilder-rendern.mjs ${{ steps.faellig.outputs.tage }}
