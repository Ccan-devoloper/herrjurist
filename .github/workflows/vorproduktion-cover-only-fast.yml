name: Vorproduktion · Cover-only fast

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/cover-only-fast.trigger"

permissions:
  contents: write

concurrency:
  group: instagram-bot-cover-only-fast
  cancel-in-progress: true

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Cover 29.09 bis 08.10 providerfrei rendern
        run: node bin/vorproduktion-cover-only-patch.mjs 2026-09-29 2026-09-30 2026-10-01 2026-10-02 2026-10-03 2026-10-04 2026-10-05 2026-10-06 2026-10-07 2026-10-08
