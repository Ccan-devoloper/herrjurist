name: YouTube Angebot und Annahme - ElevenLabs
on:
  push:
    branches: [codex/youtube-angebot-audio]
    paths:
      - youtube/angebot/script.json
      - youtube/angebot/generate-audio.mjs
      - .github/workflows/youtube-angebot-audio.yml
  workflow_dispatch:
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ElevenLabs voice masters
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node youtube/angebot/generate-audio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: angebot-elevenlabs-audio
          path: youtube/angebot/audio/*
          retention-days: 7
