name: Editor-Layouts fuer Vorproduktion

# Erzeugt Layout-Karten (*.jpg.layout.json) fuer bereits gerenderte
# Vorproduktions-Folien im Asset-Zweig, damit der Dashboard-Editor
# gebackene Texte direkt anklickbar machen kann.
# Reines Chromium-Rendering: 0 Provideraufrufe, keine Secrets noetig.
# Gespeicherte JPEGs werden nie veraendert.

on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Daten (leer = alle Tage mit Vorproduktion)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Layout-Karten erzeugen und in den Asset-Zweig schreiben
        run: node bin/editor-layouts-rendern.mjs ${{ inputs.tage }}
