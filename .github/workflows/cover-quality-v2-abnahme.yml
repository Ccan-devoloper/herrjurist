name: Cover Quality v2 Real Acceptance

on:
  push:
    branches:
      - feature/cover-quality-v2
    paths:
      - "src/**"
      - "bin/cover-quality-v2-abnahme.mjs"
      - "bin/cover-quality-v2-single.mjs"
      - "test/**"
      - ".github/workflows/cover-quality-v2-abnahme.yml"
      - "assets/charaktere/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-quality-v2-acceptance
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[cancel-queued]') }}

jobs:
  real-acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[cancel-queued]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: bunt
      IG_CHARAKTERE: "true"
      IG_CHARAKTER_GUETE: high
      IG_CHARAKTER_RETRY_GUETE: xhigh
      IG_CHARAKTER_REEL_GUETE: medium
      IG_CHARAKTER_REEL_RETRY_GUETE: high
      IG_CHARAKTER_QA: "true"
      IG_CHARAKTER_QA_MODELL: gpt-5.4-mini
      IG_CHARAKTER_REFERENZ_KANTE: "768"
      IG_CHARAKTER_MIN_ABSTAND_MS: "13000"
      IG_RENDER_SKALA: "1"
      IG_STIMME: pico
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Regression tests synthesize ffmpeg fixtures and render one Playwright
      # screenshot, so both runtime dependencies must exist before npm test.
      - name: Install test media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Static and regression checks
        run: |
          npm run lint
          npm test

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libttspico-utils python3-pip
          python3 -m pip install --break-system-packages "rembg[cpu]"

      - name: Require provider secrets
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY secret missing" && exit 1)
          test -n "$IG_WISSEN_KEY" || (echo "IG_WISSEN_KEY secret missing" && exit 1)

      - name: Run real 10-cover and reel acceptance
        if: ${{ !contains(github.event.head_commit.message, '[single-cover]') }}
        run: node bin/cover-quality-v2-abnahme.mjs

      - name: Run exactly one new Strafrecht cover
        if: ${{ contains(github.event.head_commit.message, '[single-cover]') }}
        run: node bin/cover-quality-v2-single.mjs

      - name: Upload full visual acceptance artifact
        if: ${{ always() && !contains(github.event.head_commit.message, '[single-cover]') }}
        uses: actions/upload-artifact@v4
        with:
          name: cover-quality-v2-real-${{ github.sha }}
          path: out/cover-quality-v2
          if-no-files-found: warn
          retention-days: 14

      - name: Upload single-cover artifact
        if: ${{ always() && contains(github.event.head_commit.message, '[single-cover]') }}
        uses: actions/upload-artifact@v4
        with:
          name: cover-quality-v2-single-strafrecht-${{ github.sha }}
          path: out/cover-quality-v2-single
          if-no-files-found: warn
          retention-days: 14


  cancel-marker:
    if: ${{ contains(github.event.head_commit.message, '[cancel-queued]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancelling older queued acceptance run via concurrency; no provider calls."
