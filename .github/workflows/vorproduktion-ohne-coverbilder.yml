name: Vorproduktion · 3 Tage ohne Coverbilder

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/ohne-bilder.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_STIMME: "piper"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      IG_REEL_LAYOUT: "erklaer"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: ffmpeg und Piper offline
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Drei Review-Tage lokal rendern
        run: node bin/vorproduktion-ohne-coverbilder-rendern.mjs 2026-09-26 2026-09-27 2026-09-28

      - name: Statische Review-Dateien sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-ohne-coverbilder-${{ github.run_id }}
          path: |
            .instagram-assets/vorproduktion/2026-09-26/fertig/**/*.jpg
            .instagram-assets/vorproduktion/2026-09-27/fertig/**/*.jpg
            .instagram-assets/vorproduktion/2026-09-28/fertig/**/*.jpg
          if-no-files-found: ignore
          retention-days: 7
