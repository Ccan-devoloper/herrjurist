name: Vorproduktion · 10 Tage ohne Coverbilder

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/ohne-bilder.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      IG_REEL_LAYOUT: "erklaer"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: ffmpeg und Piper offline
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Tests
        run: npm test

      - name: Zehn Review-Tage providerfrei vorbereiten
        run: >
          node bin/vorproduktion-vorbereiten.mjs
          2026-09-29 2026-09-30
          2026-10-01 2026-10-02 2026-10-03 2026-10-04
          2026-10-05 2026-10-06 2026-10-07 2026-10-08

      - name: Zehn Review-Tage lokal rendern
        run: >
          node bin/vorproduktion-ohne-coverbilder-rendern.mjs
          2026-09-29 2026-09-30
          2026-10-01 2026-10-02 2026-10-03 2026-10-04
          2026-10-05 2026-10-06 2026-10-07 2026-10-08

      - name: Statische Review-Dateien sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-ohne-coverbilder-${{ github.run_id }}
          path: |
            .instagram-assets/vorproduktion/2026-09-29/fertig/**/*
            .instagram-assets/vorproduktion/2026-09-30/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-01/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-02/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-03/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-04/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-05/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-06/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-07/fertig/**/*
            .instagram-assets/vorproduktion/2026-10-08/fertig/**/*
          if-no-files-found: ignore
          retention-days: 7
