name: Vorproduktion · gezielte Reparatur

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/reparatur.trigger"

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  reparieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_STIL: "bunt"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Lokale Bildwerkzeuge
        run: pip install --quiet pillow numpy opencv-python-headless

      - name: Providerfreie Reparatur aus bestehenden Assets
        run: node bin/vorproduktion-reparatur-kostenlos.mjs vorproduktion/reparatur.trigger

      - name: Reparierte Dateien zur Sichtpruefung sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-repariert-${{ github.run_id }}
          path: |
            .instagram-assets/vorproduktion/2026-09-24/fertig/**
            .instagram-assets/vorproduktion/2026-09-25/fertig/**
          if-no-files-found: error
          retention-days: 7
