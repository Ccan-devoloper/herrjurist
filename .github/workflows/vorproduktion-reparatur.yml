name: Vorproduktion · gezielte Reparatur

on:
  push:
    branches: [main]
    paths:
      - "vorproduktion/reparatur.trigger"

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  reparieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      IG_STIL: "bunt"
      IG_BILDER: "true"
      IG_BILD_KI: "true"
      IG_CHARAKTERE: "true"
      IG_CHARAKTER_MODELL: "gpt-image-2.5-sunburst-2026-09-08"
      IG_CHARAKTER_GUETE: "high"
      IG_CHARAKTER_RETRY_GUETE: "xhigh"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      ELEVENLABS_API_KEY: ""
      IG_VORPRODUKTION_BILD_BUDGET_USD: "0.50"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Freisteller
        run: |
          pip install --quiet "rembg[cli]" onnxruntime

      - name: Reparaturparameter lesen und gezielt rendern
        shell: bash
        run: |
          set -euo pipefail
          DATEI="vorproduktion/reparatur.trigger"
          TAGE="$(jq -r '.tage | join(" ")' "$DATEI")"
          SLOTS="$(jq -r '.slots | join(",")' "$DATEI")"
          STORIES="$(jq -r '.stories | join(",")' "$DATEI")"
          EXTRA=()
          if [ "$(jq -r '.nurCover // false' "$DATEI")" = "true" ]; then EXTRA+=(--cover-only); fi
          EXTRA+=(--patch)
          node bin/vorproduktion-rendern.mjs $TAGE --slots="$SLOTS" --stories="$STORIES" "${EXTRA[@]}"

      - name: Rohbilder als Notfallkopie sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-reparatur-rohbilder-${{ github.run_id }}
          path: |
            .instagram-assets/vorproduktion/*/rohbilder/*.png
            .instagram-assets/vorproduktion/*/rohbilder/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Telemetrie sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorproduktion-reparatur-telemetrie-${{ github.run_id }}
          path: /tmp/herrjurist-vorproduktion-*/telemetrie/telemetrie.ndjson
          if-no-files-found: ignore
          retention-days: 30
