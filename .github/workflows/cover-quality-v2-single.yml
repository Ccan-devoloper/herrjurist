name: Cover Quality v2 Single Strafrecht

on:
  push:
    branches:
      - feature/cover-quality-v2
    paths:
      - "bin/cover-quality-v2-single.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-quality-v2-single
  cancel-in-progress: false

jobs:
  single-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: bunt
      IG_CHARAKTERE: "true"
      IG_CHARAKTER_GUETE: high
      IG_CHARAKTER_RETRY_GUETE: xhigh
      IG_CHARAKTER_QA: "true"
      IG_CHARAKTER_QA_MODELL: gpt-5.4-mini
      IG_CHARAKTER_REFERENZ_KANTE: "768"
      IG_CHARAKTER_MIN_ABSTAND_MS: "13000"
      IG_RENDER_SKALA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install render/media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          npx playwright install --with-deps chromium
          python3 -m pip install --break-system-packages "rembg[cpu]"

      - name: Require provider secrets
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY secret missing" && exit 1)
          test -n "$IG_WISSEN_KEY" || (echo "IG_WISSEN_KEY secret missing" && exit 1)

      - name: Run exactly one new Strafrecht cover
        run: node bin/cover-quality-v2-single.mjs

      - name: Upload single-cover artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-quality-v2-single-strafrecht-${{ github.sha }}
          path: out/cover-quality-v2-single
          if-no-files-found: warn
          retention-days: 14
