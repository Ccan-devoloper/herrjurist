name: 29.09. GbR – cinematic test reel with ElevenLabs

on:
  push:
    branches: [codex/reel-test-20260929]
    paths:
      - 'reel-2026-09-29/**'
      - '.github/workflows/reel-story-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg and caption font
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg fonts-urw-base35 >/dev/null
      - name: Render review reel with the approved narrator voice and sound effects
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: PhufIH7nYh2Up1uej6aY
          ELEVENLABS_MODEL: eleven_multilingual_v2
        run: node reel-2026-09-29/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-2026-09-29-gbr-prueffassung
          path: |
            reel-2026-09-29/out/herrjurist-2026-09-29-gbr-prueffassung.mp4
            reel-2026-09-29/out/cover.jpg
            reel-2026-09-29/out/untertitel-einzelwort.ass
            reel-2026-09-29/out/timing.json
            reel-2026-09-29/audio/*.mp3
            reel-2026-09-29/audio/alignment.json
          if-no-files-found: warn
          retention-days: 30
