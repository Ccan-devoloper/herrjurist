name: Landingpage bereitstellen

# Lädt landingpage/ + functions/ per Wrangler direkt zu Cloudflare Pages hoch (Projekt „herrjurist“).
# Die Git-Anbindung von Cloudflare scheitert an der Repo-Größe (~2 GB, Klonen bricht nach 10 Minuten ab),
# deshalb holt dieser Lauf nur die beiden Ordner (sparse checkout).
# Benötigt: Secrets CLOUDFLARE_API_TOKEN (Recht „Cloudflare Pages: Edit“) und CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: [landingpage/**, functions/**, .github/workflows/landingpage-deploy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landingpage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            landingpage
            functions
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Legt das Projekt beim ersten Lauf an; existiert es schon, schlägt nur dieser Schritt still fehl
      - if: env.CLOUDFLARE_API_TOKEN != ''   # ohne Secrets (noch nicht eingerichtet) nichts tun
        run: npx --yes wrangler@4 pages project create herrjurist --production-branch main || true
      - if: env.CLOUDFLARE_API_TOKEN != ''   # ohne Secrets (noch nicht eingerichtet) nichts tun
        run: npx --yes wrangler@4 pages deploy landingpage --project-name herrjurist --branch main --commit-dirty=true
