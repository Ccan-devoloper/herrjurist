name: One-off corrected German legal reel narration v2
on:
  push:
    paths:
      - .github/workflows/voice-reels-corrected.yml
permissions:
  contents: read
jobs:
  create-voice:
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate clear German legal narration within included credits
        run: node bin/voice-reels-corrected.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          REEL_VOICE_BATCH: ${{ matrix.batch }}
          REEL_VOICE_ID: PhufIH7nYh2Up1uej6aY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-voice-batch-${{ matrix.batch }}
          path: voice-output-corrected/batch-${{ matrix.batch }}/
