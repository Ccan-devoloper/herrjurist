name: YouTube Willenserklärung · freigegebener Sprecher

on:
  push:
    branches: [codex/youtube-willenserklaerung-test]
    paths:
      - 'youtube/willenserklaerung/**'
      - '.github/workflows/youtube-willenserklaerung-audio.yml'

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freigegebene deutsche Erzählerstimme mit Alignment
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node youtube/willenserklaerung/generate-audio.mjs
      - name: Ton-Masters für den Schnitt sichern
        uses: actions/upload-artifact@v4
        with:
          name: youtube-willenserklaerung-audio
          path: youtube/willenserklaerung/audio/
          if-no-files-found: error
          retention-days: 7
