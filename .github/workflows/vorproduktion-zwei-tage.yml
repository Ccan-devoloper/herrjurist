name: Vorproduktion · weitere Tage providerfrei

# Zwei Stufen, gesteuert über vorproduktion/zwei-tage.trigger:
#   modus=vorbereiten → Planer wählt die Themen regelkonform; der Rohentwurf
#                       landet nur im Log, der Asset-Zweig bleibt unberührt.
#   modus=rendern     → die redaktionell finalisierten vorproduktion/<datum>.json
#                       aus dem Repository werden übernommen und gerendert.
#   modus=hook-update → Cover-Hooks aus vorproduktion/hook-update.json setzen,
#                       betroffene Reels neu bauen, Cover/Teaser mit Freisteller neu.
#   modus=quiz-patch  → Quiz-Optionen aus vorproduktion/quiz-optionen.json in die
#                       Frage-/Antwort-Stories eintragen und nur diese neu rendern.
on:
  push:
    branches: [main, "claude/vorproduktion-**"]
    paths:
      - "vorproduktion/zwei-tage.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  vorproduktion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      IG_REEL_LAYOUT: "erklaer"
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Trigger lesen
        id: trigger
        run: |
          echo "modus=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("vorproduktion/zwei-tage.trigger","utf8")).modus)')" >> "$GITHUB_OUTPUT"
          echo "tage=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("vorproduktion/zwei-tage.trigger","utf8")).tage.join(" "))')" >> "$GITHUB_OUTPUT"

      - name: Themen providerfrei vorbereiten (nur Log)
        if: steps.trigger.outputs.modus == 'vorbereiten'
        env:
          IG_NO_PUSH: "true"
        run: |
          node bin/vorproduktion-vorbereiten.mjs ${{ steps.trigger.outputs.tage }}
          for d in ${{ steps.trigger.outputs.tage }}; do
            echo "===== ROHENTWURF $d ====="
            cat ".instagram-assets/vorproduktion/$d.json"
            echo "===== ENDE $d ====="
          done

      - name: Chromium
        if: steps.trigger.outputs.modus != 'vorbereiten'
        run: npx playwright install --with-deps chromium

      - name: ffmpeg und Piper offline
        if: steps.trigger.outputs.modus == 'rendern' || steps.trigger.outputs.modus == 'hook-update'
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Redaktionelle Fassung übernehmen
        if: steps.trigger.outputs.modus == 'rendern'
        run: node bin/vorproduktion-tage-uebernehmen.mjs ${{ steps.trigger.outputs.tage }}

      - name: Providerfrei rendern
        if: steps.trigger.outputs.modus == 'rendern'
        run: |
          # Der Render-Einstieg zweigt bei einer Patch-Triggerdatei ab; hier
          # soll immer der vollständige Tagesrender laufen.
          rm -f vorproduktion/review-render-only.trigger
          node bin/vorproduktion-ohne-coverbilder-rendern.mjs ${{ steps.trigger.outputs.tage }}

      - name: Quiz-Optionen eintragen und Frage-/Antwort-Stories neu rendern
        if: steps.trigger.outputs.modus == 'quiz-patch'
        run: node bin/vorproduktion-quiz-patch.mjs

      - name: Starke Hooks setzen und betroffene Reels neu bauen
        if: steps.trigger.outputs.modus == 'hook-update'
        run: |
          pip install --quiet Pillow
          node bin/vorproduktion-hook-update.mjs

      - name: Cover und Teaser mit vorhandenem Freisteller neu rendern
        if: steps.trigger.outputs.modus == 'hook-update'
        run: |
          IG_COVER_SLOTS=$(node -e 'console.log(Object.keys(require("./vorproduktion/hook-update.json").beitraege).join(","))') \
            node bin/vorproduktion-coverbilder-anwenden.mjs
